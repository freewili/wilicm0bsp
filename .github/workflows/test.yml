name: BSP tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python tools/fw.py setup
      - run: python tools/fw.py install hello_python --apps-dir dist/apps
      - run: python tools/fw.py install wifi_analyzer --apps-dir dist/apps
  linux-driver:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y git ca-certificates build-essential cmake pkg-config libgpiod-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake -S . -B build-driver -DWILICM0_BUILD_DRIVER=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-driver --parallel 2
      - run: cmake --install build-driver --prefix /tmp/wilicm0-install
